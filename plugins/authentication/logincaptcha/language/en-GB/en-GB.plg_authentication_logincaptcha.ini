PLG_LOGINCAPTCHA="Authentication - Login Captcha"
PLG_LOGINCAPTCHA_XML_DESCRIPTION="Shows a CAPTCHA on the login form to block automated (bot) login attempts. Optionally issues a signed cookie after a successful login so real users do not have to solve the CAPTCHA every time (default ~3 months). <strong>Requires a CAPTCHA plugin to be enabled, and the core &quot;Authentication - Joomla&quot; plugin to be disabled</strong> (this plugin replaces it)."
PLG_LOGINCAPTCHA_CAPTCHA_FAILED="CAPTCHA verification failed. Please try again."
PLG_LOGINCAPTCHA_CAPTCHA_NOTENABLED="No CAPTCHA plugin is enabled. Enable one under Plugins to activate the login CAPTCHA."
PLG_LOGINCAPTCHA_SETCOOKIE_LABEL="Skip CAPTCHA after login"
PLG_LOGINCAPTCHA_SETCOOKIE_DESC="If enabled, a signed cookie is set after a successful login so the user does not have to solve the CAPTCHA on every login until it expires (see Cookie Lifetime)."
PLG_LOGINCAPTCHA_COOKIETIME_LABEL="Cookie Lifetime (seconds)"
PLG_LOGINCAPTCHA_COOKIETIME_DESC="How long the &quot;skip CAPTCHA after login&quot; cookie stays valid before the CAPTCHA is required again. Default 7889238 seconds (~3 months)."
PLG_LOGINCAPTCHA_WARN_CORE_JOOMLA_ENABLED="Login CAPTCHA: the core &quot;Authentication - Joomla&quot; plugin is enabled and will let logins bypass the CAPTCHA. Disable it so the CAPTCHA is enforced."
